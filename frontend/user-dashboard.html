<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - EMS PT. Local Central Digital</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <div>
            <p class="eyebrow">User Area</p>
            <h1>EMS PT. LOCAL CENTRAL DIGITAL</h1>
        </div>
        <button type="button" class="secondary-button" onclick="logout()">Logout</button>
    </header>

    <main class="simple-dashboard">
        <section class="panel profile-panel">
            <div class="brand-mark small">LCD</div>
            <h2>Selamat datang di EMS PT. LOCAL CENTRAL DIGITAL</h2>
            <dl class="profile-list">
                <dt>Username</dt>
                <dd id="profileUsername">-</dd>
                <dt>Email</dt>
                <dd id="profileEmail">-</dd>
                <dt>Role</dt>
                <dd id="profileRole">-</dd>
                <dt>Employee ID</dt>
                <dd id="profileEmployeeId">-</dd>
                <dt>Employee Name</dt>
                <dd id="profileEmployeeName">-</dd>
            </dl>
            <div id="userMessage" class="message" aria-live="polite"></div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/user.js"></script>
</body>
</html>
